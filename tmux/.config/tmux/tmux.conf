unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g prefix C-s
set -g mouse on


bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position bottom

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "arcticicestudio/nord-tmux"

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# Forward OSC 8 hyperlinks and clipboard from terminal through tmux
set -g set-clipboard on
set -as terminal-features ',*:hyperlinks'
set -as terminal-features ',*:clipboard'

# Initialize TMUX plugin manager. Anything that nord-tmux (or other plugins)
# would clobber must come AFTER this `run` line, not before — that's why the
# Claude attention block lives below.
run '~/.tmux/plugins/tpm/tpm'

# Window list with two per-window markers, both kept in tmux user options
# and driven by ~/.claude/hooks/:
#   @rig-stage      → pipeline icon before #W (plan/auto/draft/pr/merged),
#                     set by ~/.claude/hooks/tmux-stage.sh
#   @claude-attention → ● after #W when sub-Claude needs attention,
#                       set by ~/.claude/hooks/tmux-attention.sh
# Both must come AFTER the TPM `run` above — nord-tmux clobbers these otherwise.
set -g window-status-format         "#[fg=black,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#I #[fg=white,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#{s/explore/🔭 /:#{s/trunk/🌳 /:#{s/review/🔍 /:#{s/plan/📋 /:#{s/auto/🚧 /:#{s/draft/✏️ /:#{s/pr/👀 /:#{s/approved/✅ /:#{s/merged/🚀 /:#{E:@rig-stage}}}}}}}}}}#W#{?#{E:@claude-attention},  ●,} #F #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-current-format "#[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#I #[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#{s/explore/🔭 /:#{s/trunk/🌳 /:#{s/review/🔍 /:#{s/plan/📋 /:#{s/auto/🚧 /:#{s/draft/✏️ /:#{s/pr/👀 /:#{s/approved/✅ /:#{s/merged/🚀 /:#{E:@rig-stage}}}}}}}}}}#W#{?#{E:@claude-attention},  ●,} #F #[fg=cyan,bg=black,nobold,noitalics,nounderscore]"

# Clear the attention marker when the user switches into the window, and
# also refresh @rig-stage at the same time so external state changes (PR
# approvals, merges done in the browser) show up the moment you flip to
# that window. `-ga` appends an additional action to the hook.
# Use `session-window-changed` (not `window-pane-changed` — that hook
# doesn't exist on tmux ≤3.6; it was silently rejected before).
# `client-session-changed` handles detach/reattach.
set-hook -g  session-window-changed 'set-option -wq @claude-attention 0'
set-hook -ga session-window-changed 'run-shell -b "TMUX_PANE=#{pane_id} ~/.claude/hooks/tmux-stage.sh"'
set-hook -g  client-session-changed 'set-option -wq @claude-attention 0'
